<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>预算管家</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="预算管家">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 主应用 -->
<div id="app">

  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">预算管家</h1>
      <div class="header-actions">
        <button id="btnSync" class="icon-btn" title="同步" aria-label="同步">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button id="btnSettings" class="icon-btn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- 月份切换 -->
    <div class="month-switcher">
      <button id="prevMonth" class="month-btn" aria-label="上个月">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="month-label" id="monthLabel">2026 年 10 月</div>
      <button id="nextMonth" class="month-btn" aria-label="下个月">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button id="goToday" class="month-today">今天</button>
    </div>
  </header>

  <!-- 页面容器 -->
  <main id="pageContainer">
    <!-- 条目页面 -->
    <section id="itemsPage" class="page active">
      <!-- 汇总卡片 -->
      <div class="summary-cards">
        <div class="summary-card income">
          <div class="summary-label">本月收入</div>
          <div class="summary-value" id="sumIncome">¥0.00</div>
        </div>
        <div class="summary-card budget">
          <div class="summary-label">已建预算</div>
          <div class="summary-value" id="sumBudget">¥0.00</div>
        </div>
        <div class="summary-card reconciled">
          <div class="summary-label">已核销</div>
          <div class="summary-value" id="sumReconciled">¥0.00</div>
        </div>
        <div class="summary-card remaining">
          <div class="summary-label">待核销</div>
          <div class="summary-value" id="sumRemaining">¥0.00</div>
        </div>
      </div>

      <!-- 三级结构列表 -->
      <div class="hierarchy-list" id="hierarchyList">
        <!-- 动态渲染：收入 > 预算 > 核销 -->
      </div>
    </section>

    <!-- 分析页面 -->
    <section id="analysisPage" class="page">
      <div class="analysis-container">
        <h2 class="section-title">月度分析</h2>

        <!-- 预算使用情况 -->
        <div class="analysis-card">
          <h3 class="analysis-title">预算使用概览</h3>
          <canvas id="chartOverview"></canvas>
        </div>

        <!-- 收入 vs 支出 -->
        <div class="analysis-card">
          <h3 class="analysis-title">收入 / 核销对比</h3>
          <canvas id="chartCompare"></canvas>
        </div>

        <!-- 预算进度 -->
        <div class="analysis-card">
          <h3 class="analysis-title">各预算核销进度</h3>
          <div id="budgetProgress"></div>
        </div>

        <!-- 统计数据 -->
        <div class="analysis-card stats-grid">
          <div class="stat-item">
            <div class="stat-num" id="statIncome">¥0.00</div>
            <div class="stat-label">总收入</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statExpense">¥0.00</div>
            <div class="stat-label">总核销</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statBudget">0</div>
            <div class="stat-label">预算数</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statSavings">¥0.00</div>
            <div class="stat-label">结余</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部 Tab 栏 -->
  <nav class="bottom-tabs">
    <button class="tab-btn active" data-page="items">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      <span>条目</span>
    </button>
    <button class="tab-btn" data-page="analysis">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>分析</span>
    </button>
  </nav>
</div>

<!-- 浮动添加按钮 -->
<button id="fabAdd" class="fab" aria-label="添加">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- 通用弹窗容器 -->
<div id="modalRoot"></div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- 应用脚本 -->
<script type="module" src="js/app.js"></script>

</body>
</html>
